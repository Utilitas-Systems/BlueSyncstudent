# App lives in ./nexus-class-sync-main (zip layout). GitHub only loads workflows from repo root.
name: Build and Publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_DIR: nexus-class-sync-main
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: nexus-class-sync-main

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'BlueSync Student v${{ steps.version.outputs.version }} (build ${{ github.run_number }})'
          body: 'See the assets below to download. Choose Mac (Apple Silicon or Intel) or Windows.'
          draft: false
          prerelease: false

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rustTarget: aarch64-apple-darwin
            tauriArgs: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-latest
            rustTarget: x86_64-apple-darwin
            tauriArgs: --target x86_64-apple-darwin --bundles app,dmg
          - platform: windows-latest
            rustTarget: x86_64-pc-windows-msvc
            tauriArgs: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: nexus-class-sync-main/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Install dependencies
        run: npm ci

      # Signed updater archives need TAURI_SIGNING_PRIVATE_KEY (full minisign secret key file).
      # If the secret is missing or not a real private key, still ship installers; skip updater JSON/signatures.
      - name: Configure updater for CI
        id: configure_updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.KEY ? String(process.env.KEY).trim() : '';
          const hasPublicMarker = /minisign public key/i.test(raw);
          const hasSecretMarker =
            /minisign encrypted secret key/i.test(raw) ||
            /minisign secret key/i.test(raw);
          const looksValidPrivateKey = raw.length >= 80 && hasSecretMarker && !hasPublicMarker;
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!looksValidPrivateKey) {
            if (raw.length > 0) {
              if (hasPublicMarker) {
                console.log('::warning::TAURI_SIGNING_PRIVATE_KEY looks like a PUBLIC key. Use the secret key from `tauri signer generate`, not the .pub file. Building without signed updater artifacts.');
              } else {
                console.log('::warning::TAURI_SIGNING_PRIVATE_KEY is not a valid minisign secret key. Building without signed updater artifacts.');
              }
            } else {
              console.log('::notice::TAURI_SIGNING_PRIVATE_KEY not set — building without signed updater artifacts.');
            }
            j.bundle = j.bundle || {};
            j.bundle.createUpdaterArtifacts = false;
            if (j.plugins && j.plugins.updater) j.plugins.updater.active = false;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          } else {
            console.log('Valid minisign private key detected; updater artifacts will be generated.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_signing_key=${looksValidPrivateKey}\n`);
          NODE

      # Multiline secrets in YAML ${{ }} often break on macOS runners; append to GITHUB_ENV instead.
      - name: Load signing secrets for Tauri (multiline-safe)
        if: steps.configure_updater.outputs.has_signing_key == 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          DELIM="TAURI_SIGNING_KEY___EOF___"
          echo "TAURI_SIGNING_PRIVATE_KEY<<$DELIM" >> "$GITHUB_ENV"
          printf '%s\n' "$SIGNING_KEY" >> "$GITHUB_ENV"
          echo "$DELIM" >> "$GITHUB_ENV"
          if [ -n "${SIGNING_PASSWORD+x}" ] && [ -n "$SIGNING_PASSWORD" ]; then
            DELIM2="TAURI_SIGNING_PW___EOF___"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<$DELIM2" >> "$GITHUB_ENV"
            printf '%s\n' "$SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "$DELIM2" >> "$GITHUB_ENV"
          fi

      - name: Build and Publish Tauri
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must be only `npm run tauri` — the action adds `build` itself. A package.json script
          # `"tauri": "tauri build"` + default detection would become `tauri build build` and fail.
          tauriScript: npm run tauri
          projectPath: nexus-class-sync-main
          args: ${{ matrix.tauriArgs }}
          releaseId: ${{ needs.prepare.outputs.releaseId }}
          releaseBody: 'See the assets below to download. Choose Mac (Apple Silicon or Intel) or Windows.'
          includeUpdaterJson: ${{ steps.configure_updater.outputs.has_signing_key == 'true' }}
          updaterJsonPreferNsis: ${{ steps.configure_updater.outputs.has_signing_key == 'true' }}

      - name: Collect release files for manual website upload
        shell: bash
        run: |
          mkdir -p ci-release/updates ci-release/installers
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const bundleRoot = path.join(root, 'src-tauri', 'target', 'release', 'bundle');
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            const out = [];
            for (const name of fs.readdirSync(dir)) {
              const p = path.join(dir, name);
              const st = fs.statSync(p);
              if (st.isDirectory()) out.push(...walk(p));
              else out.push(p);
            }
            return out;
          }
          function copyIf(file, test, destDir) {
            const base = path.basename(file);
            if (!test(base.toLowerCase())) return false;
            const dest = path.join(root, destDir, base);
            fs.copyFileSync(file, dest);
            return true;
          }
          const files = walk(bundleRoot);
          let copied = 0;
          for (const file of files) {
            copied += copyIf(file, (n) => n === 'latest.json', 'ci-release/updates') ? 1 : 0;
            copied += copyIf(file, (n) => n.endsWith('.nsis.zip') || n.endsWith('.nsis.zip.sig') || n.endsWith('.app.tar.gz') || n.endsWith('.app.tar.gz.sig'), 'ci-release/updates') ? 1 : 0;
            copied += copyIf(file, (n) => n.endsWith('.exe') || n.endsWith('.msi') || n.endsWith('.dmg'), 'ci-release/installers') ? 1 : 0;
          }
          console.log(`Collected ${copied} files`);
          NODE

      - name: Verify updater artifacts exist
        if: steps.configure_updater.outputs.has_signing_key == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const updatesDir = path.join(root, 'ci-release', 'updates');
          const files = fs.existsSync(updatesDir) ? fs.readdirSync(updatesDir) : [];
          const lower = files.map((f) => f.toLowerCase());
          const target = process.env.RUST_TARGET || '';

          function has(regex) {
            return lower.some((name) => regex.test(name));
          }

          const hasLatest = has(/^latest\.json$/);
          if (!hasLatest) {
            console.log('::error::Missing latest.json in ci-release/updates.');
            process.exit(1);
          }

          if (target.includes('windows')) {
            const hasArchive = has(/\.nsis\.zip$/);
            const hasSig = has(/\.nsis\.zip\.sig$/);
            if (!hasArchive || !hasSig) {
              console.log('::error::Windows updater artifacts missing (.nsis.zip and/or .nsis.zip.sig).');
              process.exit(1);
            }
          } else if (target.includes('apple-darwin')) {
            const hasArchive = has(/\.app\.tar\.gz$/);
            const hasSig = has(/\.app\.tar\.gz\.sig$/);
            if (!hasArchive || !hasSig) {
              console.log('::error::macOS updater artifacts missing (.app.tar.gz and/or .app.tar.gz.sig).');
              process.exit(1);
            }
          }

          console.log(`Updater artifact verification passed for ${target}.`);
          NODE
        env:
          RUST_TARGET: ${{ matrix.rustTarget }}

      - name: Upload website updater files artifact
        if: steps.configure_updater.outputs.has_signing_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updates-${{ matrix.rustTarget }}
          path: nexus-class-sync-main/ci-release/updates
          if-no-files-found: ignore

      - name: Upload installer files artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.rustTarget }}
          path: nexus-class-sync-main/ci-release/installers
          if-no-files-found: ignore
